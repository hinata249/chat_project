{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <!-- 💡 作成した共通のlogin.cssを読み込みます -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<h2>ログイン</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">ログイン</button>
</form>

<p><a href="{% url 'signup' %}">新しくアカウントを作る方はこちら</a></p>

<!-- 💡 クラス名（class="..."）を指定して、CSSファイル側から見た目を制御します -->
<div class="guest-bypass-container">
    <hr class="guest-bypass-line">
    <a href="{% url 'chat_room' %}" class="btn-guest-view">
        🔑 ログインせずにチャットを見る（閲覧専用）
    </a>
</div>

</body>
</html>
